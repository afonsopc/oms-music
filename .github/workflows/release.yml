# Release por tag (pedido do dono, 2026-08-16): `git tag v1.0.0 && git push
# --tags` compila TUDO - bundle web (zip), dmg macOS, exe Windows (NSIS),
# deb/AppImage/flatpak Linux, apk Android e ipa iOS - e publica numa GitHub
# release. O desktop-builds.yml continua a ser o smoke test de master; este
# so corre em tags v*.
#
# O que fica CLARO desde ja sobre assinaturas (nenhum secret e obrigatorio):
#  - macOS: assinatura ad-hoc (tauri.conf.json), sem notarizacao.
#  - Android: debug keystore do prebuild - instala em qualquer lado, mas a
#    Play Store precisaria de keystore propria.
#  - iOS: o ipa vai SEM assinatura (CODE_SIGNING_ALLOWED=NO). Instala-se com
#    AltStore/Sideloadly, que reassinam; TestFlight/App Store precisariam de
#    certificados da Apple nos secrets.
#  - Updater Tauri: com TAURI_SIGNING_PRIVATE_KEY nos secrets os .sig sao
#    reais; sem ele gera-se chave descartavel e os .sig NAO servem para
#    actualizar instalacoes existentes (mesmo padrao do desktop-builds.yml).

name: release

on:
  # SO manual (dono, 2026-08-18: "n podemos correr essa CI nunca mais" -
  # ~$3 por release em runners macOS). O caminho normal e o
  # scripts/release-local.sh, gratis; isto fica como ultimo recurso.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: bundle web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # O mesmo pipeline que alimenta music.omelhorsite.pt (watchdog do
      # expo export incluido, expo/expo#43890).
      - name: expo export -p web
        run: ./scripts/build-web.sh
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Zipar dist/
        run: cd dist && zip -qr "../oms-music-web-${GITHUB_REF_NAME}.zip" .
      # O dist/ segue tambem como artifact proprio: o job desktop embrulha-o
      # (ensure-dist.sh ve dist/index.html e nao reconstroi).
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: oms-music-web-*.zip
          retention-days: 3

  desktop:
    name: desktop ${{ matrix.os }}
    needs: web
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 = arm64; assinatura ad-hoc, sem notarizacao.
          - os: macos-14
            bundles: app,dmg
          # ubuntu-22.04 = glibc minimo suportado (linux-builder.Dockerfile);
          # o deb deste job e tambem a fonte do flatpak.
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-release-${{ matrix.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config patchelf \
            desktop-file-utils squashfs-tools \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/
      - name: Dependencias do shell (desktop/)
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Preparar chave do updater
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p keys
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > keys/updater.key
            echo "==> A usar a chave do updater dos secrets"
          else
            echo "::warning::Sem TAURI_SIGNING_PRIVATE_KEY nos secrets: chave DESCARTAVEL. Os .sig desta release nao servem como update de instalacoes existentes."
            bun run tauri signer generate -w keys/updater.key --password "descartavel"
            echo "TAURI_THROWAWAY_PASSWORD=descartavel" >> "$GITHUB_ENV"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: tauri build
        working-directory: desktop
        shell: bash
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat keys/updater.key)"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_KEY_PASSWORD:-${TAURI_THROWAWAY_PASSWORD:-}}"
          bun run tauri build --bundles "${{ matrix.bundles }}"
        env:
          CI: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.os }}
          retention-days: 3
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig

  flatpak:
    name: flatpak
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-desktop-ubuntu-22.04
          path: bundle/
      # Reempacota o deb do job Linux (receita oficial Tauri v2, ver
      # desktop/flatpak/*.yml) - nada de recompilar Rust aqui.
      - name: flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder binutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//46 org.gnome.Sdk//46
          cp desktop/flatpak/pt.omelhorsite.music.desktop.yml stage.yml
          cp "$(find bundle -name '*.deb' | head -1)" oms-music.deb
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build stage.yml
          flatpak build-bundle flatpak-repo "oms-music-${GITHUB_REF_NAME}.flatpak" pt.omelhorsite.music.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: "*.flatpak"
          retention-days: 3

  android:
    name: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      # android/ e gerado (gitignored): prebuild limpo, como no build local.
      - name: expo prebuild
        run: bunx expo prebuild -p android
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
      - name: gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Renomear apk
        run: cp android/app/build/outputs/apk/release/app-release.apk "oms-music-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: "*.apk"
          retention-days: 3

  ios:
    name: ipa
    # macos-26: o expo-glass-effect usa APIs do iOS 26 e precisa do Xcode 26
    # (as imagens macos-15 ficam-se pelo 16.x).
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # prebuild corre o pod install; ios/ e gerado, tal como android/.
      - name: expo prebuild
        run: bunx expo prebuild -p ios
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
      # Sem certificados: archive com assinatura desligada e o .app vai num
      # Payload/ zipado - o formato ipa e exactamente isso. AltStore e
      # companhia reassinam na instalacao.
      - name: xcodebuild archive (sem assinatura)
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/oms.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Empacotar ipa
        run: |
          mkdir -p Payload
          cp -R build/oms.xcarchive/Products/Applications/*.app Payload/
          zip -qry "oms-music-${GITHUB_REF_NAME}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: "*.ipa"
          retention-days: 3

  publish:
    name: github release
    needs: [web, desktop, flatpak, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets/
          merge-multiple: true
      - name: Listar assets
        run: find assets -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Builds automáticos da tag `${{ github.ref_name }}`.

            - **Web**: `oms-music-web-*.zip` (export estático, o mesmo de music.omelhorsite.pt)
            - **macOS**: `.dmg` (arm64, assinatura ad-hoc — clicar direito → Abrir na primeira vez)
            - **Windows**: instalador `.exe` (NSIS)
            - **Linux**: `.deb`, `.AppImage` e `.flatpak` (x86_64; `flatpak install oms-music-*.flatpak`)
            - **Android**: `.apk` (debug keystore — desinstalar versões com outra assinatura primeiro)
            - **iOS**: `.ipa` **sem assinatura** — instalar via AltStore/Sideloadly, que reassinam
          files: |
            assets/**/*.zip
            assets/**/*.dmg
            assets/**/*.app.tar.gz
            assets/**/*.exe
            assets/**/*.deb
            assets/**/*.AppImage
            assets/**/*.flatpak
            assets/**/*.apk
            assets/**/*.ipa
            assets/**/*.sig
