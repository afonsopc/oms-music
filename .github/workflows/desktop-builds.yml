# Builds do shell desktop (plano "uma so app", F5 / 3.6) - a alternativa de
# CI ao build local (desktop/scripts/build-macos.sh e build-linux.sh).
#
# O que este workflow FAZ: compila o export web uma vez, constroi o .app/.dmg
# em macOS arm64 e o .deb/AppImage em ubuntu-22.04 x86_64 (a base de glibc
# mais antiga suportada, de proposito - ver linux-builder.Dockerfile), e sobe
# tudo como artifacts do run. O que NUNCA faz: publicar releases, tocar no
# updater endpoint, notarizar, ou deploy de qualquer especie.
#
# SEGREDOS (placeholders documentados, NENHUM incluido aqui):
#   TAURI_SIGNING_PRIVATE_KEY          conteudo de desktop/keys/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD password da chave (vazia por agora)
# Sem estes segredos configurados, cada job gera uma chave DESCARTAVEL so
# para o build nao partir (createUpdaterArtifacts esta ligado e exige
# assinatura). Artefactos assinados com chave descartavel NUNCA podem ser
# usados como update de uma instalacao existente - servem para smoke test e
# mais nada, e o log grita isso.
# Notarizacao macOS (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID) fica
# documentada em desktop/README.md e fora daqui: exige conta paga e nao
# pertence ao caminho critico de um build de verificacao.

name: desktop-builds

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "desktop/**"
      - "scripts/build-web.sh"
      - ".github/workflows/desktop-builds.yml"

jobs:
  web-export:
    name: export web (dist/)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun install a partir do lockfile existente; nada aqui adiciona
      # dependencias ao package.json da app.
      - name: Instalar dependencias da app
        run: bun install --frozen-lockfile

      # O mesmo pipeline que alimenta music.omelhorsite.pt e que o shell
      # embrulha (watchdog do expo export incluido, expo/expo#43890).
      - name: expo export -p web
        run: ./scripts/build-web.sh
        env:
          EXPO_NO_TELEMETRY: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  desktop:
    name: shell ${{ matrix.os }}
    needs: web-export
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 = arm64. Assinatura ad-hoc (signingIdentity "-" no
          # tauri.conf.json); sem Developer ID nao ha notarizacao, e esta
          # bem assim - o artefacto e para verificacao.
          - os: macos-14
            bundles: app,dmg
            bundle_dir: src-tauri/target/release/bundle
          # ubuntu-22.04 = x86_64 nativo com webkit2gtk-4.1 e o glibc
          # minimo suportado; e o build Linux "a serio" (o build-linux.sh
          # local em arm64 e para iterar).
          - os: ubuntu-22.04
            bundles: deb,appimage
            bundle_dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      # Cache do cargo chaveada ao Cargo.lock do shell; poupa a maior fatia
      # do tempo de build sem arriscar staleness.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # A lista canonica de deps de build do Tauri v2 em Ubuntu 22.04
      # (espelho do linux-builder.Dockerfile).
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config patchelf \
            desktop-file-utils squashfs-tools \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Dependencias do shell (desktop/)
        working-directory: desktop
        run: bun install --frozen-lockfile

      # Chave do updater: a real vem dos secrets; sem secrets, gera-se uma
      # descartavel para o bundler nao partir. NUNCA promover um artefacto
      # assinado com chave descartavel a release.
      - name: Preparar chave do updater
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p keys
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > keys/updater.key
            echo "==> A usar a chave do updater dos secrets"
          else
            echo "::warning::Sem TAURI_SIGNING_PRIVATE_KEY nos secrets: a gerar chave DESCARTAVEL. Estes artefactos nao servem como update de instalacoes existentes."
            bun run tauri signer generate -w keys/updater.key --password "descartavel"
            echo "TAURI_THROWAWAY_PASSWORD=descartavel" >> "$GITHUB_ENV"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # CI=true tambem no macOS do GitHub: salta a decoracao AppleScript da
      # janela do DMG (mesma parede de TCC/headless do build local).
      - name: tauri build
        working-directory: desktop
        shell: bash
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat keys/updater.key)"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_KEY_PASSWORD:-${TAURI_THROWAWAY_PASSWORD:-}}"
          bun run tauri build --bundles "${{ matrix.bundles }}"
        env:
          CI: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          retention-days: 7
          path: |
            desktop/${{ matrix.bundle_dir }}/dmg/*.dmg
            desktop/${{ matrix.bundle_dir }}/macos/*.app.tar.gz
            desktop/${{ matrix.bundle_dir }}/macos/*.app.tar.gz.sig
            desktop/${{ matrix.bundle_dir }}/deb/*.deb
            desktop/${{ matrix.bundle_dir }}/appimage/*.AppImage
            desktop/${{ matrix.bundle_dir }}/appimage/*.AppImage.sig
